services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kidogopay
    ports:
      - "5432:5432"
    volumes:
      - kidogopay-db:/var/lib/postgresql/data

volumes:
  kidogopay-db:
